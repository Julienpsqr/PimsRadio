# Optional engine validation (spec 002): nightly and manual, never blocks the main CI.
name: Engine
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:engine
